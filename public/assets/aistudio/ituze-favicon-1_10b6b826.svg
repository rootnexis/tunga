<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ITUZE">
  <title>ITUZE — Luxury E-Commerce</title>
  <defs>
    <!-- Deep Royal Obsidian-Indigo Squircle Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E114A"/>
      <stop offset="50%" stop-color="#11092E"/>
      <stop offset="100%" stop-color="#070417"/>
    </linearGradient>

    <!-- Ambient Inner Radial Glow -->
    <radialGradient id="ambientGlow" cx="64" cy="42" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F8BFF" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070417" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Rim Metallic Bevel Gradient -->
    <linearGradient id="rimGrad" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Sculpted 3D Luxury Bag Front Gradient -->
    <linearGradient id="bagGrad" x1="24" y1="34" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="42%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Bag Top Glass Highlight -->
    <linearGradient id="bagShine" x1="28" y1="38" x2="72" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden-Cyan Star Accent -->
    <linearGradient id="goldAccent" x1="54" y1="12" x2="74" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="dropGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#03010A" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Outer Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ambientGlow)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Corner Luxury Sparkle -->
  <path d="M98 18 L100.2 23.8 L106 26 L100.2 28.2 L98 34 L95.8 28.2 L90 26 L95.8 23.8 Z" fill="url(#goldAccent)"/>

  <!-- Main Emblem Group -->
  <g filter="url(#dropGlow)" transform="translate(4, 4)">
    <!-- Bag Handle Arch -->
    <path d="M43 44V31a15 15 0 0 1 30 0v13" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Luxury Shopping Bag Body -->
    <path d="M24 40H90L96 98H18Z" fill="url(#bagGrad)" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>

    <!-- Specular Diagonal Fold Highlight on Bag -->
    <path d="M26 42H88L62 82H21Z" fill="url(#bagShine)"/>

    <!-- Deep Cutout Shadow for Express Cart -->
    <path d="M30 50H39L43 60" fill="none" stroke="#0D0726" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 60H102L93 83H52Z" fill="#0D0726" stroke="#0D0726" stroke-width="9" stroke-linejoin="round"/>
    <path d="M52 83L55 91H92" fill="none" stroke="#0D0726" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="98.5" r="9.5" fill="#0D0726"/>
    <circle cx="86" cy="98.5" r="9.5" fill="#0D0726"/>

    <!-- Crisp Pure White Express Cart Foreground -->
    <path d="M30 50H39L43 60" fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 60H102L93 83H52Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Signature ITUZE 'Z' Electric Slash Inside Cart Basket -->
    <path d="M64 64H79L69 79H54Z" fill="url(#bagGrad)"/>
    <path d="M80 64H91L81 79H70Z" fill="#38BDF8" opacity="0.85"/>

    <!-- Cart Lower Rail & Wheels -->
    <path d="M52 83L55 91H92" fill="none" stroke="#FFFFFF" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="98.5" r="5.8" fill="#FFFFFF"/>
    <circle cx="86" cy="98.5" r="5.8" fill="#FFFFFF"/>
    <circle cx="60" cy="98.5" r="2.5" fill="#2563EB"/>
    <circle cx="86" cy="98.5" r="2.5" fill="#2563EB"/>
  </g>
</svg>
